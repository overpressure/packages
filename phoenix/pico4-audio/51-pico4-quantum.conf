# The graph's smallest quantum (docs/userspace.md#audio), about PICO OS's 20 ms deep-buffer period.
# Games ask for 5 ms, which runs every client on a 2.7 ms cycle; under a game's load clients then
# miss cycles, and each miss is a hole of silence in the mix, heard as a crack.
context.properties = {
    default.clock.min-quantum = 1024
}
