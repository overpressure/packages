# Playback on MultiMedia1 (PCM 0) and capture on MultiMedia2 (PCM 1): mainline's ASM front end
# runs one stream at a time, where PICO OS records on MultiMedia1 too. The verb connects both paths
# (one output, one input); DAPM powers the amplifiers only while a stream runs.
SectionVerb {
	EnableSequence [
		# "speaker" (mainline routes AIF1_PB to both RX paths itself: no RX MUX controls)
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX1 INP0' RX1"
		# PICO OS's levels again here: ALSA's saved state (restored at boot, after the card's
		# BootSequence) would otherwise keep whatever it holds, which was 16 dB lower.
		cset "name='WSA_RX0 Digital Volume' 84"
		cset "name='WSA_RX1 Digital Volume' 84"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='WSA_COMP2 Switch' 1"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft Smart Boost Level' 7"
		cset "name='SpkrRight Smart Boost Level' 7"
		# No voltage/current sense: nothing reads it. PICO OS's speaker protection is off too (speaker.prot.enable=false).
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight DAC Switch' 1"
		# "deep-buffer-playback"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		# "handset-mic" (amic1, the WCD9380's ADC1 on its first SoundWire capture port)
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='TX_DEC0 Volume' 84"
		# "audio-record"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_COMP2 Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Microphone"
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
