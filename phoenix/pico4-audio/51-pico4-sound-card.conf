# The sound card's PCMs run on the ADSP (docs/userspace.md#audio): their position advances one
# 1024-frame period at a time. Below that quantum, as SteamVR's sounds ask for, PipeWire missed
# the DSP's deadline about 34 times a second; two periods of headroom keep it ahead down to 64
# frames, one period was not enough. The card's driver calls itself a batch device, for which PipeWire
# halves the period and adds a period of headroom.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom = 2048
        api.alsa.disable-batch = true
      }
    }
  }
]
