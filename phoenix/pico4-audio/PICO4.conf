# The PICO 4's sound card on a mainline kernel (the SM8250 machine driver, model "PICO4": two
# WSA8810 speakers, the analog microphone on the WCD9380's ADC1), docs/userspace.md#audio. Routes
# and levels are PICO OS's, under mainline's control names.
Syntax 4

SectionUseCase."HiFi" {
	File "/conf.d/sm8250/PICO4-HiFi.conf"
	Comment "Speakers and microphone"
}

# PICO OS's defaults for the controls the routes use.
BootSequence [
	cset "name='WSA_RX0 Digital Volume' 84"
	cset "name='WSA_RX1 Digital Volume' 84"
	cset "name='TX_DEC0 Volume' 84"
	cset "name='ADC1 Volume' 12"
]
