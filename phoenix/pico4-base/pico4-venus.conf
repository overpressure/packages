# The Frame's codec links (/dev/video-dec0, /dev/video-enc0) through the PICO 4's vrdevice_path,
# which opens the codec's nodes, once the codec is probed with its firmware
# (docs/session.md#steam-link).
[Unit]
ConditionPathExists=/usr/lib/firmware/venus.mdt
Wants=pico4-venus-probe.service
After=pico4-venus-probe.service
