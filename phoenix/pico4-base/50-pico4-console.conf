# Only critical kernel messages on the headset's UART console. journald
# copies warnings and errors to the kernel log for pstore (journald.conf.d/50-pico4.conf);
# printed on the 115200-baud console they keep a CPU in interrupt-off console writes. After
# a session that logged errors by the thousand, journald spent minutes flushing them on CPU7,
# which takes the display interrupt: vblank events and retire fences then came on the 10 ms
# scheduler tick and SteamVR's present waits timed out by the hundreds.
kernel.printk = 3 4 1 7
