# PICO OS's reclaim settings for this kernel and its zram swap (init.qcom.post_boot.sh;
# docs/userspace.md#memory): swap as readily as file pages, and wake kswapd early enough
# that a game's GPU allocations do not run into direct reclaim.
vm.swappiness = 100
vm.watermark_scale_factor = 90
vm.watermark_boost_factor = 0
# PICO OS's init.rc: allocations never fail; when memory and swap run out the OOM killer takes
# the process with the highest score (a game) instead of failing a service's allocation.
vm.overcommit_memory = 1
