# zram as big as the RAM, with zstd, over the Frame's half the RAM with lzo-rle (holo-zram-swap): the Frame
# has 16 GB, the PICO 4 8. With the Frame's size a large PC game (H3VR under Proton and FEX) filled the swap,
# froze the headset for about 110 s, crashed SteamVR's server and was killed; with this it keeps running,
# slowly. zstd held the same swapped data at 2.7 : 1 against lzo-rle's 2.0 : 1, about 0.7 GB more RAM free
# (phoenix's docs/userspace.md#memory).
[zram0]
zram-size = ram
compression-algorithm = zstd
