# Keys only, on the USB link and on Wi-Fi: the keys the installer wrote to the data partition
# (/root/.ssh/authorized_keys). No password ever logs in (docs/security.md). The host keys are made
# on the first boot (sshdgenkeys.service) and kept in the /etc overlay.
PermitRootLogin prohibit-password
PermitEmptyPasswords no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
X11Forwarding no
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
