# PID 1 policy on the PICO 4. A crashed systemd reboots instead of freezing;
# the next boot starts the system again or, after a failed start, recovery. Short stop timeouts keep
# a hung service from delaying the runner's recovery reboot.
# The SoC's watchdog (qcom_wdt, at most 30 s) for a PID 1 that stops pinging it: its bark panics
# (pico4.config) and panic=5 resets the headset, 33 s after the last ping. Preinit counts boots that
# end this way (docs/install.md, "Boot attempts").
[Manager]
CrashAction=reboot
DefaultTimeoutStopSec=15s
ShowStatus=yes
RuntimeWatchdogSec=30s
