# Replaces the Steam Frame's drop-in of the same name (steamos-customizations-deckard): its limits
# for SteamVR's and PipeWire's threads, without --no-polkit, an option of Valve's own RTKit build.
# Arch's RTKit 0.13 refuses it and does not start; it asks polkit instead (docs/userspace.md#audio).
[Service]
ExecStart=
ExecStart=/usr/lib/rtkit-daemon \
  --threads-per-user-max=200 \
  --actions-per-burst-max=1000 \
  --max-realtime-priority=80 \
  --our-realtime-priority=81 \
  --no-chroot
