# Valve's unit restarts SteamVR always, and each start takes 15-20 s, so systemd's
# default start limit never applies. Every start resets the controller radio: a
# compositor that crashes on start buzzed the controllers every few seconds, without
# end (docs/session.md). Restarts wait 25 s, so the radio resets at most every 35 s or
# so; after three starts in five minutes systemd gives up, and pico4-steamvr-failed.service
# ends the session (pico4-session.service starts a new one, within its own start limit).
# RestartMode=direct keeps the unit out of the failed state between restarts: otherwise
# OnFailure= runs at the first crash. It also keeps a restart from reaching gamescope
# (PartOf=steamvr.service), which stays bound to the compositor that is gone, without Steam's
# panel: steamvr-ended ends the session when SteamVR ends without a stop being asked for.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3
OnFailure=pico4-steamvr-failed.service

[Service]
RestartSec=25
RestartMode=direct
ExecStopPost=-/usr/libexec/pico4/steamvr-ended
