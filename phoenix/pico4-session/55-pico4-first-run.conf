# The first-run setup before the Steam client (docs/session.md#first-run-setup): the client
# unpacks itself first (Valve's health check, an earlier ExecStartPre), since the setup shows its
# texts and fonts, then waits until the setup is finished or skipped, or someone signed in before.
[Service]
ExecStartPre=/usr/libexec/pico4/wait-first-run
TimeoutStartSec=infinity
