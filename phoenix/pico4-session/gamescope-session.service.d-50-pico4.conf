# gamescope on the PICO 4 (docs/session.md). With the OpenVR backend, input comes through SteamVR's overlays and
# gamescope's EIS socket; wlroots must not insist on libinput devices.
# OpenGL on the GPU is zink on Turnip, the Frame's OpenGL (its Mesa has no other driver). Xwayland's
# glamor (and so DRI3 for X11 clients) needs it (docs/graphics.md).
[Service]
Environment=WLR_LIBINPUT_NO_DEVICES=1
Environment=MESA_LOADER_DRIVER_OVERRIDE=zink
