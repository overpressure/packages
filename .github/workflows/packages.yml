# SPDX-License-Identifier: Unlicense
# Every pull request, push to main and tag: the layout checked, then every package of the headsets' layers
# built in its own job, natively on arm64, in overpressure's build image pinned by digest. Each package is
# built once per key (build/plan.py: its recipe, the build script, the image, the headset's definition):
# a key built before comes from main's cache, or from the artifact an earlier run of this repository (never
# a fork's) left under that key, such as the pull request's. One job then writes each layer's database.
# A tag (YYYY.MM.DD, or YYYY.MM.DD.N) publishes the packages its pull request built as a release: per layer
# its packages and its database, and the copyleft packages' complete sources. A release's download folder
# is a pacman server for every layer.
name: Packages

on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILDER: ghcr.io/overpressure/builder:2026.11.12@sha256:ba4a5ec8adb886b60b873b28d7d6454abd40c1a58d08a6f6fd7d5efc65d8e4b2
  HEADSETS: phoenix
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Layers, recipes and image definitions
        run: python3 -m unittest -v
      - name: The shell scripts, the build's and the recipes'
        run: python3 build/shellcheck.py
      - name: The packages to build
        id: plan
        run: |
          packages=$(python3 build/plan.py --builder "$BUILDER" $HEADSETS)
          echo "$packages" | python3 -m json.tool
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  package:
    needs: layout
    name: ${{ matrix.package.layer }}/${{ matrix.package.name }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.layout.outputs.packages) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read # an earlier run's build
    env:
      KEY: package-${{ matrix.package.headset }}-${{ matrix.package.name }}-${{ matrix.package.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The cached build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: ${{ env.KEY }}
      - name: An earlier run's build
        id: earlier
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OURS: "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == ${{ github.repository_id }})][0].id // empty"
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$KEY&per_page=30" --jq "$OURS")
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > earlier.zip
            mkdir -p out && unzip -q earlier.zip -d out && rm earlier.zip
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$KEY: built before (artifact $id)"
          fi
      - name: The package
        if: steps.cache.outputs.cache-hit != 'true' && steps.earlier.outputs.found != 'true'
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work "$BUILDER" \
            bash build/packages.sh "${{ matrix.package.headset }}" /var/tmp/packages /work/out "${{ matrix.package.name }}"
      - name: Its logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.package.headset }}-${{ matrix.package.name }}
          path: out/logs/
      - name: Kept for the next build
        if: steps.cache.outputs.cache-hit != 'true' && env.RELEASE != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: ${{ env.KEY }}
      - run: ls -lR out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.KEY }}
          path: out/
          if-no-files-found: error

  databases:
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: out
          merge-multiple: true
      - name: Each layer's database
        run: |
          for headset in $HEADSETS; do
            docker run --rm --privileged -v "$PWD:/work" -w /work "$BUILDER" \
              bash build/packages.sh --databases "$headset" /var/tmp/packages /work/out
          done
          ls -lR out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: databases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One file per name: headsets that share a layer build its packages alike, or the release stops.
          mkdir release
          find packages -type f -print0 | while IFS= read -r -d '' f; do
            n=release/$(basename "$f")
            if [ -e "$n" ]; then cmp -s "$f" "$n" || { echo "two different $n" >&2; exit 1; }; else cp "$f" "$n"; fi
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          {
            echo "Packages and databases of the layers, and the copyleft packages' sources."
            echo "A pacman server for every layer: \`Server = https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME\`."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md release/*
