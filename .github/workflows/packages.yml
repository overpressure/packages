# SPDX-License-Identifier: Unlicense
# Every pull request, push to main and tag: the layout checked, then every package of the headsets' layers
# built in its own job, natively on arm64, in overpressure's build image pinned by digest. Each package is
# built once per key (build/plan.py: its recipe, the build script, the image, the headset's definition):
# a key built before comes from main's cache, or from the artifact an earlier run of this repository (never
# a fork's) left under that key, such as the pull request's. One job then writes each layer's database.
# A tag (YYYY.MM.DD, or YYYY.MM.DD.N, annotated, on main) publishes the packages its pull request built as a
# release: per layer its packages and its database, and the copyleft packages' complete sources, with notes on
# what changed since the previous release. A release's download folder is a pacman server for every layer.
# The last job, ci, passes only when every job before it passed: the one check main's ruleset requires.
name: Packages

on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILDER: ghcr.io/overpressure/builder:2026.11.12@sha256:ba4a5ec8adb886b60b873b28d7d6454abd40c1a58d08a6f6fd7d5efc65d8e4b2
  HEADSETS: phoenix
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - name: Layers, recipes and image definitions
        run: python3 -m unittest -v
      - name: The shell scripts, the build's and the recipes'
        run: python3 build/shellcheck.py
      - name: The Python code, overpressure's ruff and ty (pyproject.toml)
        run: |
          uvx ruff@0.17.4 format --check .
          uvx ruff@0.17.4 check .
          uvx ty@0.0.98 check
      - name: The workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: The packages to build
        id: plan
        run: |
          read -ra headsets <<< "$HEADSETS"
          packages=$(python3 build/plan.py --builder "$BUILDER" "${headsets[@]}")
          echo "$packages" | python3 -m json.tool
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  package:
    needs: layout
    name: ${{ matrix.package.layer }}/${{ matrix.package.name }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.layout.outputs.packages) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read # an earlier run's build
    env:
      KEY: package-${{ matrix.package.headset }}-${{ matrix.package.name }}-${{ matrix.package.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The cached build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: ${{ env.KEY }}
      - name: An earlier run's build
        id: earlier
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OURS: "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == ${{ github.repository_id }})][0].id // empty"
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$KEY&per_page=30" --jq "$OURS")
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > earlier.zip
            mkdir -p out && unzip -q earlier.zip -d out && rm earlier.zip
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$KEY: built before (artifact $id)"
          fi
      - name: The package
        if: steps.cache.outputs.cache-hit != 'true' && steps.earlier.outputs.found != 'true'
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work "$BUILDER" \
            bash build/packages.sh "${{ matrix.package.headset }}" /var/tmp/packages /work/out "${{ matrix.package.name }}"
      - name: Its logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.package.headset }}-${{ matrix.package.name }}
          path: out/logs/
      - name: Kept for the next build
        if: steps.cache.outputs.cache-hit != 'true' && env.RELEASE != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out
          key: ${{ env.KEY }}
      - run: ls -lR out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.KEY }}
          path: out/
          if-no-files-found: error

  databases:
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: out
          merge-multiple: true
      - name: Each layer's database
        run: |
          for headset in $HEADSETS; do
            docker run --rm --privileged -v "$PWD:/work" -w /work "$BUILDER" \
              bash build/packages.sh --databases "$headset" /var/tmp/packages /work/out
          done
          ls -lR out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: databases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the history and the tags: what changed since the previous release
      - name: An annotated tag on main
        run: |
          set -euo pipefail
          # The tag object and main as they are on origin: checkout may leave an annotated tag as a lightweight one.
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "$GITHUB_REF_NAME is a lightweight tag: a release needs an annotated one, whose message opens its notes" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME^{commit}" origin/main; then
            echo "$GITHUB_REF_NAME is not on main: a release is a merged main commit" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One file per name: headsets that share a layer build its packages alike, or the release stops.
          mkdir release
          find packages -type f -print0 | while IFS= read -r -d '' f; do
            n=release/$(basename "$f")
            if [ -e "$n" ]; then cmp -s "$f" "$n" || { echo "two different $n" >&2; exit 1; }; else cp "$f" "$n"; fi
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          # The previous release: the one whose tag sorts last before this one by version; none for the first.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' > releases
          previous=$({ cat releases; echo "$GITHUB_REF_NAME"; } | sort -uV | grep -xF -B1 "$GITHUB_REF_NAME" | head -n -1)
          since=()
          if [ -n "$previous" ]; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir previous
            since=(--previous "$previous" --previous-sums previous/SHA256SUMS)
          fi
          python3 build/notes.py --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" "${since[@]}" \
            release/SHA256SUMS > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md release/*

  # The one check main's ruleset requires: it passes only when every job of the build passed. A package built
  # before (main's cache, an earlier run's artifact) skips its build step, not its job, which still succeeds;
  # no job here is skipped by design, so a skipped one means a job it needs failed or the run was cancelled.
  # The release, on tags only, is not part of it.
  ci:
    if: always()
    needs: [layout, package, databases]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed" >&2
            exit 1
          fi
          echo "every job passed"
