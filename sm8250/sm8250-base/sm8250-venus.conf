# The Frame's codec links (/dev/video-dec0, /dev/video-enc0) through the headset's vrdevice_path,
# which opens the codec's nodes, once the codec is probed with its firmware
# (a headset's docs/session.md).
[Unit]
ConditionPathExists=/usr/lib/firmware/venus.mdt
Wants=sm8250-venus-probe.service
After=sm8250-venus-probe.service
