# PID 1 policy. A crashed systemd reboots instead of freezing;
# the next boot starts the system again or, after a failed start, recovery. Short stop timeouts keep
# a hung service from delaying the runner's recovery reboot.
# The SoC's watchdog (Qualcomm's qcom_wdt takes at most 30 s) for a PID 1 that stops pinging it: its bark panics
# (the headset's kernel config) and panic=5 resets the headset, 33 s after the last ping. Preinit counts boots that
# end this way (overpressure's docs/runtime.md, "Boot attempts").
[Manager]
CrashAction=reboot
DefaultTimeoutStopSec=15s
ShowStatus=yes
RuntimeWatchdogSec=30s
