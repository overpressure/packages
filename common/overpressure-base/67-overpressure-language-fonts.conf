<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The image's own Noto CJK collection carries one face per language, and fontconfig's
  generic families otherwise pick the Japanese face for all of them. Steam's interface,
  SteamVR's dashboard, the first-run setup and Plasma ask for sans-serif, Noto Sans,
  serif or monospace; each gets its language's face here. Arabic gets Noto Sans Arabic
  (Naskh) instead of the Urdu Nastaliq face that sans-serif would otherwise pick.
-->
<fontconfig>
  <description>Prefer the face of the text's language in the Noto CJK and Arabic families</description>

  <!-- Chinese (Simplified) -->
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-cn</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-cn</string></test>
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-cn</string></test>
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-cn</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- Chinese (Traditional, Taiwan) -->
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-tw</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-tw</string></test>
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-tw</string></test>
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-tw</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>

  <!-- Chinese (Traditional, Hong Kong) -->
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-hk</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-hk</string></test>
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-hk</string></test>
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-hk</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

  <!-- Japanese -->
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <!-- Korean -->
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>

  <!-- Arabic: Naskh, not the Urdu Nastaliq face sans-serif would pick; Urdu keeps Nastaliq -->
  <match target="pattern">
    <test name="lang" compare="eq"><string>ar</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ar</string></test>
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>

  <!-- Mixed-language fallback: content whose lang is the UI's (for example a Chinese game
       title in an English UI) still gets a CJK or Arabic face after the Latin families.
       The language rules above keep their own face first. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Arabic</string></edit>
  </match>

  <!-- Urdu keeps Nastaliq; the appended Noto Sans Arabic is only a fallback. -->
  <match target="pattern">
    <test name="lang" compare="eq"><string>ur</string></test>
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Nastaliq Urdu</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ur</string></test>
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Nastaliq Urdu</string></edit>
  </match>
</fontconfig>
