# pacman configuration for the PICO 4 SteamOS-compatible userspace (roadmap step 4).
#
# The public Holo Core aarch64 preview resolves everything by default.
# packages.txt takes a few packages explicitly from Valve's Steam Frame
# ("deckard") hotfix repository: above all systemd 257.7, the Frame's own
# version. The Frame repository is not first: several of its
# libraries (ffmpeg, freerdp, ...) were built against the Frame's private base
# and need older library versions than the public preview provides.
# The image's build checks the Frame binaries' libraries.
#
# Neither Valve repository publishes package or database signatures. Integrity
# rests on HTTPS plus the hashes in packages.lock. The installed system gets this file with
# "IgnorePkg = systemd ..." added and without the overpressure repositories.

[options]
Architecture = aarch64
HoldPkg = pacman glibc
ParallelDownloads = 4
# Skip documentation: the image stays small.
NoExtract = usr/share/help/* usr/share/doc/* usr/share/gtk-doc/* usr/share/info/* usr/share/man/*
# SteamVR (docs/session.md): the Frame's tracking and lens drivers, the
# Frame controller radio's firmware and programming scripts (never run on the
# PICO's station), other controllers' firmware and Windows binaries (its Android
# client stays: Lepton's Android games load it). The
# Index, Vive, Touch and Frame controller resources stay: SteamVR's remapping for the
# PICO 4's controllers (pico_controller) needs their controller types, and the Frame's
# Android games bind only the Frame controller.
NoExtract = opt/steamvr/drivers/cv/* opt/steamvr/drivers/frame_controller/resources/firmware/* opt/steamvr/drivers/frame_hmd/resources/firmware/*
NoExtract = opt/steamvr/drivers/indexcontroller/resources/firmware/* opt/steamvr/drivers/htc/resources/firmware/*
NoExtract = opt/steamvr/bin/*.dll opt/steamvr/tools/eyetracking/* opt/steamvr/tools/vrcalib/*
# The Frame's Vulkan layers: Lepton needs their manifests; the implicit OpenXR layer
# (foveated rendering injection) would join every OpenXR client of the session.
NoExtract = usr/share/openxr/1/api_layers/implicit.d/XrApiLayer_VALVE_fdm_injection.json
# adb for Lepton: not the Frame's adbd (its USB gadget function, units and modules) or the
# platform's headers.
NoExtract = usr/lib/android-sdk/platform-tools/adbd usr/lib/modules-load.d/adbd.conf usr/lib/systemd/system/adbd*
NoExtract = usr/lib/systemd/system/dev-usb*ffs-adb.mount usr/lib/systemd/system/usb-gadget.service.d/usb-gadget-adbd-restart.conf
NoExtract = usr/include/android/*
# With "Optional", pacman requested the missing signature of every package: minutes
# per installation for nothing.
SigLevel = Never
LocalFileSigLevel = Optional

# overpressure's packages, one repository per layer (layers), the headset's own first: a release's
# downloads or a local build of build/packages.sh, as local repositories of the image's build.
[overpressure-phoenix]
SigLevel = Never
Server = file:///var/cache/overpressure/phoenix

[overpressure-sm8250]
SigLevel = Never
Server = file:///var/cache/overpressure/sm8250

[overpressure-common]
SigLevel = Never
Server = file:///var/cache/overpressure/common

[core]
Server = https://holo-packages.steamos.cloud/holo-core-aarch64-preview/mash-20251118.3/$repo/os/$arch

[extra]
Server = https://holo-packages.steamos.cloud/holo-core-aarch64-preview/mash-20251118.3/$repo/os/$arch

[deckard-arch-hotfixes-release-0.3]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard-hotfixes/release/0.3.x
